<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Words</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 12px;
    font-family: "Comic Sans MS", "Chalkboard SE", "Avenir Next", system-ui, sans-serif;
    background: #fffdf5; color: #222;
    -webkit-user-select: none; user-select: none;
  }
  h1 { text-align: center; margin: 4px 0 8px; font-size: 28px; }
  p.tip { text-align: center; margin: 8px 0 12px; color: #666; font-size: 16px; }
  .modes {
    display: flex; justify-content: center; gap: 0; margin: 0 auto; width: max-content;
    background: #efe9d6; border-radius: 999px; padding: 4px;
  }
  .modes button {
    font: inherit; font-size: 19px; font-weight: bold; color: #776;
    border: none; background: none; border-radius: 999px; padding: 8px 18px;
    cursor: pointer; touch-action: manipulation;
  }
  .modes button.on { background: #fff; color: #222; box-shadow: 0 2px 5px rgba(0,0,0,.15); }
  #banner {
    display: none; max-width: 640px; margin: 0 auto 12px; padding: 10px 14px;
    background: #fff1d6; border: 2px solid #f0c060; border-radius: 14px; font-size: 16px; text-align: center;
  }
  #banner.show { display: block; }
  #banner a { color: #2459c7; font-weight: bold; }
  .group-title { font-size: 18px; font-weight: bold; margin: 16px 4px 8px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px; align-items: start;
  }
  button.word {
    position: relative;
    font: inherit; font-size: 28px; font-weight: bold;
    padding: 18px 6px 14px;
    border: 3px solid rgba(0,0,0,.12); border-radius: 16px;
    background: var(--c); color: #222;
    cursor: pointer; touch-action: manipulation;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
    transition: transform .08s, background .2s;
  }
  button.word .num {
    position: absolute; top: 4px; left: 8px;
    font-size: 12px; font-weight: normal; color: rgba(0,0,0,.45);
  }
  button.word:active, button.word.speaking {
    transform: translateY(3px) scale(1.05);
    box-shadow: 0 1px 0 rgba(0,0,0,.15);
    border-color: #333;
  }
  .tile { display: flex; flex-direction: column; gap: 6px; transition: opacity .4s; }
  .tile > button.word { width: 100%; }
  .tile.gone { opacity: 0; pointer-events: none; }

  /* Hear it mode: tick / cross */
  .choices, .readChoices { display: none; gap: 6px; }
  .tile.open .choices, .tile.tried .readChoices { display: flex; }
  .choices button, .readChoices button {
    flex: 1; font-size: 30px; font-weight: bold; color: #fff;
    border: none; border-radius: 14px; padding: 8px 0;
    cursor: pointer; touch-action: manipulation;
    box-shadow: 0 3px 0 rgba(0,0,0,.2);
  }
  .choices .yes, .readChoices .yes { background: #2fa84f; }
  .choices .no  { background: #e0443e; }
  .readChoices .hear { background: #3b7be0; font-size: 26px; }
  .choices button:active, .readChoices button:active { transform: translateY(2px); box-shadow: none; }

  /* Read it mode */
  .status { display: none; text-align: center; font-size: 15px; font-weight: bold; line-height: 1.25; }
  .tile.listening .status, .tile.tried .status, .tile.great .status { display: block; }
  .tile.listening button.word { border-color: #e0443e; animation: listen 1s ease-in-out infinite; }
  .tile.listening .status { color: #c0392b; }
  @keyframes listen { 50% { box-shadow: 0 0 0 8px rgba(224,68,62,.25); } }
  .tile.waiting button.word, #card.waiting { border-color: #bbb; animation: none; opacity: .8; }
  .tile.waiting .status { color: #888; }
  .tile.great button.word { background: #2fa84f; color: #fff; border-color: #1f7a37; transform: scale(1.06); }
  .tile.great .status { color: #1f7a37; font-size: 18px; }
  .tile.tried .status { color: #8a5a00; }

  /* Flashcards */
  #cards { display: none; max-width: 560px; margin: 0 auto; text-align: center; }
  body.cards-mode #cards { display: block; }
  body.cards-mode #app { display: none; }
  .cardTop { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: #776; margin: 4px 6px 10px; }
  .cardTop .r { color: #1f7a37; } .cardTop .w { color: #c0392b; }
  #card {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 260px;
    font: inherit; font-size: 96px; font-weight: bold; color: #222; overflow-wrap: anywhere;
    background: var(--c, #fff3a3); border: 6px solid rgba(0,0,0,.12); border-radius: 28px;
    box-shadow: 0 8px 0 rgba(0,0,0,.15); cursor: pointer; touch-action: manipulation;
    transition: background .2s, color .2s, transform .15s;
  }
  #card.listening { border-color: #e0443e; animation: listen 1s ease-in-out infinite; }
  #card.right { background: #2fa84f; color: #fff; border-color: #1f7a37; transform: scale(1.03); }
  #card.wrong { background: #e0443e; color: #fff; border-color: #a8302b; animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  #card.pop { animation: cardIn .25s ease-out; }
  @keyframes cardIn { from { transform: scale(.85) rotate(-3deg); opacity: 0; } }
  #cardStatus { min-height: 28px; margin: 14px 0 10px; font-size: 20px; font-weight: bold; color: #555; }
  .cardBtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .cardBtns button {
    font: inherit; font-size: 22px; font-weight: bold; color: #fff; border: none; border-radius: 16px;
    padding: 12px 22px; cursor: pointer; touch-action: manipulation; box-shadow: 0 4px 0 rgba(0,0,0,.2);
  }
  .cardBtns button:active { transform: translateY(3px); box-shadow: none; }
  .cardBtns .mic { background: #e0443e; } .cardBtns .hear { background: #3b7be0; }
  .cardBtns .next { background: #2fa84f; } .cardBtns .plain { background: #8a7f6a; }
  .cardBtns button[hidden] { display: none; }
  @media (max-width: 480px) {
    .modes { width: 100%; }
    .modes button { flex: 1; font-size: 15px; padding: 8px 4px; }
    #card { min-height: 200px; }
  }
</style>
</head>
<body>
<h1>⭐ Power Words ⭐</h1>
<div class="modes">
  <button id="modeHear">🔊 Hear it</button>
  <button id="modeRead">🎤 Read it</button>
  <button id="modeCards">🃏 Flashcards</button>
</div>
<p class="tip" id="tip"></p>
<div id="banner"></div>
<div id="app"></div>
<div id="cards">
  <div class="cardTop">
    <span id="cardProg"></span>
    <span><span class="r">✓ <span id="cardRight">0</span></span> &nbsp; <span class="w">✗ <span id="cardWrong">0</span></span></span>
  </div>
  <button id="card"></button>
  <div id="cardStatus"></div>
  <div class="cardBtns">
    <button class="mic" id="cardMic" hidden>🎤 Start</button>
    <button class="plain" id="cardPause" hidden>⏸ Pause</button>
    <button class="hear" id="cardHear" hidden>🔊 Hear it</button>
    <button class="next" id="cardNext" hidden>Skip ➜</button>
    <button class="next" id="cardRedo" hidden></button>
    <button class="plain" id="cardShuffle" hidden>🔀 All words again</button>
  </div>
</div>

<script>
var groups = [
  { title: "Start here · Words 1–13", color: "#fff3a3",
    words: "the of and a to in is you that it he for was" },
  { title: "Words 14–33", color: "#cdeffd",
    words: "on are as with his they at be this from I have or by one had not but what all" },
  { title: "Words 34–53", color: "#d8f5c8",
    words: "were when we there can an your which their said if do will each about how up out them then" },
  { title: "Words 54–73", color: "#ffd9e6",
    words: "she many some so these would other into has more her two like him see time could no make than" },
  { title: "Words 74–93", color: "#e6dcff",
    words: "first been its who now people my made over did down only way find use may water long little very" },
  { title: "Words 94–109", color: "#ffe0c2",
    words: "after words called just where most know get through back much before go good new write" }
];

// A few words sound wrong when read alone, so we tell the voice how to say them.
var sayAs = { "a": "uh", "I": "eye" };

// Words that sound the same. Speech recognition can't hear spelling,
// so any of these count as reading the word correctly.
var SOUNDS_LIKE = {
  "the": ["thee", "da", "duh", "de", "tha", "thuh"], "of": ["uv", "ov"], "and": ["an", "n", "en"],
  "that": ["dat"], "this": ["dis"], "with": ["wit"], "they": ["day"], "them": ["dem"], "then": ["than", "den"],
  "was": ["wuz"], "is": ["iz"], "it": ["itt"], "at": ["att"], "on": ["onn"], "as": ["az"], "if": ["iff"], "a": ["uh", "ah", "ay", "eh"], "to": ["two", "too", "2"], "two": ["to", "too", "2"],
  "for": ["four", "fore", "4"], "i": ["eye", "aye"], "one": ["won", "1"], "no": ["know"], "know": ["no"],
  "there": ["their", "they're"], "their": ["there", "they're"], "write": ["right", "rite", "wright"],
  "by": ["buy", "bye"], "new": ["knew", "gnu"], "see": ["sea", "c"], "so": ["sew", "sow"], "be": ["bee", "b"],
  "its": ["it's"], "in": ["inn"], "made": ["maid"], "him": ["hymn"], "way": ["weigh", "whey"],
  "would": ["wood"], "which": ["witch"], "some": ["sum"], "time": ["thyme"], "where": ["wear", "ware"],
  "your": ["you're", "yore"], "you": ["u", "ewe", "yew"], "are": ["r"], "do": ["due", "dew"],
  "not": ["knot"], "been": ["bin", "ben"], "we": ["wee"], "or": ["oar", "ore"], "find": ["fined"],
  "an": ["ann", "anne"], "than": ["then"], "said": ["sed"], "words": ["word's"],
  "he": ["hee"], "her": ["hur"], "my": ["mi"], "who": ["hoo"], "little": ["lil"]
};

// ---------- speaking ----------
var voice = null;
function pickVoice() {
  var voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  var en = voices.filter(function (v) { return /^en[-_]US/i.test(v.lang); });
  if (!en.length) en = voices.filter(function (v) { return /^en/i.test(v.lang); });
  var preferred = ["Samantha", "Karen", "Moira", "Google US English"];
  for (var i = 0; i < preferred.length; i++) {
    for (var j = 0; j < en.length; j++) {
      if (en[j].name.indexOf(preferred[i]) === 0) { voice = en[j]; return; }
    }
  }
  voice = en[0] || null;
}
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function say(text, btn) {
  if (!window.speechSynthesis) { alert("Sorry, this browser can't talk."); return; }
  function go() {
    var u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.lang = "en-US"; u.rate = 0.8; u.pitch = 1.05;
    if (btn) {
      btn.classList.add("speaking");
      u.onend = u.onerror = function () { btn.classList.remove("speaking"); };
      setTimeout(function () { btn.classList.remove("speaking"); }, 1500);
    }
    speechSynthesis.speak(u);
  }
  // Safari can swallow speech that starts right after cancel(), so only
  // cancel when something is playing and wait a moment.
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(go, 120);
  } else {
    go();
  }
}
function speak(word, btn) { say(sayAs[word] || word, btn); }

// ---------- listening ----------
var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
var GITHUB_URL = "https://vvm26br2pj-max.github.io/power-words/";

function showBanner(html) { var b = document.getElementById("banner"); b.innerHTML = html; b.classList.add("show"); }
function hideBanner() { document.getElementById("banner").classList.remove("show"); }

function norm(s) {
  return s.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' ]/g, " ").replace(/\s+/g, " ").trim();
}
function editDistance(a, b) {
  var d = [];
  for (var i = 0; i <= a.length; i++) { d[i] = [i]; }
  for (var j = 1; j <= b.length; j++) d[0][j] = j;
  for (i = 1; i <= a.length; i++)
    for (j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
var POWER = {};
groups.forEach(function (g) { g.words.split(" ").forEach(function (w) { POWER[w.toLowerCase()] = true; }); });
function heardWord(word, transcript) {
  var target = word.toLowerCase();
  var ok = [target].concat(SOUNDS_LIKE[target] || []);
  var t = norm(transcript);
  if (ok.indexOf(t) >= 0) return true;
  var tokens = t.split(" ");
  for (var i = 0; i < tokens.length; i++) {
    if (ok.indexOf(tokens[i]) >= 0) return true;
    // Words of 4+ letters: allow one letter off (e.g. "peoples" for "people").
    // (Not when he said a different Power Word, e.g. "then" for "them".)
    if (target.length >= 4 && !POWER[tokens[i]] && editDistance(tokens[i], target) <= 1) return true;
  }
  return false;
}

var active = null; // the listen in progress

function stopListening() {
  if (active && !active.done) {
    active.done = true;
    clearTimeout(active.timer);
    try { active.rec.abort(); } catch (e) {}
    if (active.onCancel) active.onCancel();
  }
  active = null;
}

// Listen for one word. Phones take a moment to switch the microphone on and
// often cut off a word said too early, so:
//  - h.ready() is called only once the mic is really on ("Now read it!"),
//  - we keep listening for a few seconds, so saying it again still counts.
// h.done({ ok, kind, heard, message }) is called once:
// kind is "hit", "miss", "silent" or "mic" (microphone problem).
function recognize(word, h) {
  stopListening();
  hideBanner();
  if (!Recognition) {
    showBanner("This browser can't listen. Read it works in Safari on an iPad or iPhone, or in Chrome on a computer.");
    return false;
  }
  if (window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();

  var rec = new Recognition();
  rec.lang = "en-US";
  rec.interimResults = true;
  rec.maxAlternatives = 5;
  rec.continuous = true;
  var me = { rec: rec, done: false, heard: "", onCancel: h.onCancel, timer: null, isReady: false };
  active = me;

  function finish(kind, message) {
    if (me.done) return;
    me.done = true;
    clearTimeout(me.timer);
    if (active === me) active = null;
    try { rec.abort(); } catch (e) {}
    h.done({ ok: kind === "hit", kind: kind, heard: me.heard, message: message });
  }
  function stopSoon(ms) {
    clearTimeout(me.timer);
    me.timer = setTimeout(function () {
      if (me.done) return;
      try { rec.stop(); } catch (e) {}
      // If the browser never reports back after stopping, end it ourselves.
      me.timer = setTimeout(function () { finish(me.heard ? "miss" : "silent"); }, 1500);
    }, ms);
  }
  function ready() {
    if (me.isReady || me.done) return;
    me.isReady = true;
    if (h.ready) h.ready();
    stopSoon(6000); // 6 seconds to read it (as many tries as he likes)
  }

  rec.onstart = ready;
  rec.onaudiostart = ready;
  rec.onresult = function (e) {
    ready();
    for (var i = 0; i < e.results.length; i++) {
      for (var k = 0; k < e.results[i].length; k++) {
        var text = e.results[i][k].transcript;
        if (heardWord(word, text)) { finish("hit"); return; }
        if (k === 0 && text.trim()) me.heard = text.trim();
      }
    }
  };
  rec.onerror = function (e) {
    if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
      finish("mic", "The microphone isn't working.");
      if (window.self !== window.top) {
        showBanner("The microphone can't be used inside this page. Open " +
          '<a href="' + GITHUB_URL + '" target="_blank" rel="noopener">the Power Words website</a> in Safari to use Read it.');
      } else {
        showBanner("Please allow the microphone. On an iPad or iPhone, also check that Dictation is on: " +
          "Settings → General → Keyboard → Enable Dictation.");
      }
    } else if (e.error === "no-speech") {
      finish("silent", "I didn't hear anything. Tap and try again!");
    } else if (e.error !== "aborted") {
      finish(me.heard ? "miss" : "silent");
    }
  };
  rec.onend = function () { finish(me.heard ? "miss" : "silent"); };

  try { rec.start(); } catch (err) { finish("silent", "Tap to try again."); return false; }
  stopSoon(9000); // safety net in case the mic never starts
  return true;
}

function clearTile(tile) {
  tile.classList.remove("listening", "tried", "great", "open");
}
function hideForTwoMinutes(tile) {
  clearTile(tile);
  tile.classList.add("gone");
  setTimeout(function () { tile.classList.remove("gone"); }, 2 * 60 * 1000);
}

// Read it mode on the word board.
function listen(word, tile) {
  var status = tile.querySelector(".status");
  var started = recognize(word, {
    onCancel: function () { tile.classList.remove("listening", "waiting"); },
    ready: function () { tile.classList.remove("waiting"); status.textContent = "🎤 Now read it!"; },
    done: function (r) {
      tile.classList.remove("listening", "waiting");
      if (r.ok) {
        tile.classList.add("great");
        status.textContent = "⭐ Great reading!";
        setTimeout(function () { hideForTwoMinutes(tile); }, 1300);
      } else {
        tile.classList.add("tried");
        status.textContent = r.message ||
          (r.heard ? "Try again! I heard “" + r.heard + "”" : "Try again!");
      }
    }
  });
  if (started) {
    clearTile(tile);
    tile.classList.add("listening", "waiting");
    status.textContent = "Get ready…";
  }
}

// ---------- mode switch ----------
var mode = "hear";
try {
  var savedMode = localStorage.getItem("powerWords.mode");
  if (savedMode === "read" || savedMode === "cards") mode = savedMode;
} catch (e) {}
var TIPS = {
  hear: "Tap a word to hear it!",
  read: "Tap a word, then read it out loud!",
  cards: "Read each card out loud. It moves on by itself when you get it right!"
};
function setMode(m) {
  mode = m;
  try { localStorage.setItem("powerWords.mode", m); } catch (e) {}
  stopListening(); hideBanner();
  document.querySelectorAll(".tile").forEach(clearTile);
  document.getElementById("modeHear").classList.toggle("on", m === "hear");
  document.getElementById("modeRead").classList.toggle("on", m === "read");
  document.getElementById("modeCards").classList.toggle("on", m === "cards");
  document.body.classList.toggle("cards-mode", m === "cards");
  document.getElementById("tip").textContent = TIPS[m];
  if (m === "cards") { showCard(); startCards(); } else if (typeof stopCards === "function") stopCards();
}
document.getElementById("modeHear").onclick = function () { setMode("hear"); };
document.getElementById("modeRead").onclick = function () { setMode("read"); };
document.getElementById("modeCards").onclick = function () { setMode("cards"); };

// ---------- the words ----------
var app = document.getElementById("app");
var n = 1;
var openTile = null;
function closeOpen(except) {
  if (openTile && openTile !== except) clearTile(openTile);
}
groups.forEach(function (g) {
  var t = document.createElement("div");
  t.className = "group-title";
  t.textContent = g.title;
  app.appendChild(t);
  var grid = document.createElement("div");
  grid.className = "grid";
  g.words.split(" ").forEach(function (w) {
    var tile = document.createElement("div");
    tile.className = "tile";
    var b = document.createElement("button");
    b.className = "word";
    b.style.setProperty("--c", g.color);
    b.innerHTML = '<span class="num">' + n + '</span>' + w;
    var status = document.createElement("div");
    status.className = "status";
    var choices = document.createElement("div");
    choices.className = "choices";
    choices.innerHTML = '<button class="yes" aria-label="Got it">✓</button>' +
                        '<button class="no" aria-label="Not yet">✗</button>';
    var readChoices = document.createElement("div");
    readChoices.className = "readChoices";
    readChoices.innerHTML = '<button class="hear" aria-label="Hear it">🔊</button>' +
                            '<button class="yes" aria-label="I read it right">✓</button>';
    tile.appendChild(b);
    tile.appendChild(status);
    tile.appendChild(choices);
    tile.appendChild(readChoices);

    b.addEventListener("click", function () {
      closeOpen(tile);
      openTile = tile;
      if (mode === "read") {
        listen(w, tile);
      } else {
        speak(w, b);
        tile.classList.add("open");
      }
    });
    // Hear it: tick hides the word for 2 minutes, cross keeps it.
    choices.querySelector(".yes").addEventListener("click", function () {
      openTile = null; hideForTwoMinutes(tile);
    });
    choices.querySelector(".no").addEventListener("click", function () {
      openTile = null; clearTile(tile);
    });
    // Read it, after a miss: hear the word, or mark it right by hand.
    readChoices.querySelector(".hear").addEventListener("click", function () { speak(w, b); });
    readChoices.querySelector(".yes").addEventListener("click", function () {
      openTile = null; hideForTwoMinutes(tile);
    });

    grid.appendChild(tile);
    n++;
  });
  app.appendChild(grid);
});
// ---------- flashcards ----------
// One long listening session runs while the cards are showing, so he never
// has to press anything: read it right -> green -> next card by itself.
var ALL = []; // { w, color }
groups.forEach(function (g) {
  g.words.split(" ").forEach(function (w) { ALL.push({ w: w, color: g.color }); });
});
function shuffled(list) {
  var a = list.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
var deck;
function newDeck(list) {
  deck = { cards: shuffled(list), i: 0, right: 0, wrong: 0, missed: [], result: null };
}
newDeck(ALL);

var cardEl = document.getElementById("card");
var cardStatus = document.getElementById("cardStatus");
function btn(id, show) { document.getElementById(id).hidden = !show; }
function current() { return deck.cards[deck.i]; }
function deckDone() { return deck.i >= deck.cards.length; }

// Session state
var sess = null;        // { rec, ended }
var wantListening = false; // true while the cards should be listening
var micWorked = false;  // the mic has worked at least once this visit
var locked = false;     // between "right!" and the next card
var ignoreUntil = 0;    // ignore what the mic hears while the iPad is talking
var from = { idx: 0, prefix: "" }; // where this card's speech starts in the results

function setButtons(state) {
  // state: "listening", "needTap", "paused", "done"
  btn("cardMic", state === "needTap" || state === "paused");
  btn("cardPause", state === "listening");
  btn("cardHear", state !== "done");
  btn("cardNext", state !== "done");
  btn("cardRedo", state === "done" && deck.missed.length > 0);
  btn("cardShuffle", state === "done");
}
function updateScore() {
  document.getElementById("cardRight").textContent = deck.right;
  document.getElementById("cardWrong").textContent = deck.wrong;
}

function showCard() {
  updateScore();
  cardEl.className = "";
  void cardEl.offsetWidth;
  if (deckDone()) {
    stopCards();
    document.getElementById("cardProg").textContent = "All done!";
    cardEl.style.setProperty("--c", "#fff3a3");
    cardEl.style.fontSize = "64px";
    cardEl.textContent = deck.wrong ? "🎉" : "🏆";
    cardEl.classList.add("pop");
    cardStatus.textContent = "You read " + deck.right + " of " + deck.cards.length + " words right the first time!";
    document.getElementById("cardRedo").textContent = "🔁 Practice the red ones (" + deck.missed.length + ")";
    setButtons("done");
    say(deck.wrong ? "All done! Great work." : "Perfect! You read every word.");
    return;
  }
  var c = current();
  deck.result = null;
  document.getElementById("cardProg").textContent = "Card " + (deck.i + 1) + " of " + deck.cards.length;
  cardEl.style.setProperty("--c", c.color);
  cardEl.style.fontSize = c.w.length > 6 ? "72px" : "96px";
  cardEl.textContent = c.w;
  cardEl.classList.add("pop");
  if (sess && !sess.ended) {
    cardEl.classList.add("listening");
    cardStatus.textContent = "🎤 Read the word!";
    setButtons("listening");
  } else if (wantListening) {
    cardStatus.textContent = "Get ready…";
    setButtons("listening");
  } else {
    cardStatus.textContent = "Tap 🎤 Start to begin!";
    setButtons("paused");
  }
}

function markFrom(e) {
  // Only listen to what is said from now on (for the new card).
  if (!e || !e.results.length) { from = { idx: 0, prefix: "" }; return; }
  var last = e.results[e.results.length - 1];
  if (last.isFinal) from = { idx: e.results.length, prefix: "" };
  else from = { idx: e.results.length - 1, prefix: last[0].transcript };
}
var lastEvent = null;

function gotRight() {
  locked = true;
  if (deck.result === null) { deck.result = true; deck.right++; }
  updateScore();
  cardEl.classList.remove("wrong", "listening", "pop"); void cardEl.offsetWidth;
  cardEl.classList.add("right");
  cardStatus.textContent = "⭐ Great reading!";
  setTimeout(function () {
    deck.i++;
    markFrom(lastEvent);
    locked = false;
    showCard();
  }, 900);
}
function gotWrong(heard) {
  if (deck.result === null) { deck.result = false; deck.wrong++; deck.missed.push(current()); }
  updateScore();
  cardEl.classList.remove("wrong", "right", "pop"); void cardEl.offsetWidth;
  cardEl.classList.add("wrong");
  cardStatus.textContent = "Not quite! I heard “" + heard + "”. Try again!";
}

function startCards() {
  wantListening = true;
  hideBanner();
  if (deckDone()) return;
  if (!Recognition) {
    showBanner("This browser can't listen. Flashcards work in Safari on an iPad or iPhone, or in Chrome on a computer.");
    wantListening = false; setButtons("paused"); return;
  }
  if (sess && !sess.ended) return;
  if (window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();

  var rec = new Recognition();
  rec.lang = "en-US";
  rec.interimResults = true;
  rec.maxAlternatives = 5;
  rec.continuous = true;
  var me = { rec: rec, ended: false };
  sess = me;
  from = { idx: 0, prefix: "" };
  cardStatus.textContent = "Get ready…";
  setButtons("listening");

  function onReady() {
    if (me.ready || me.ended) return;
    me.ready = true; micWorked = true;
    if (!locked && !deckDone()) {
      cardEl.classList.add("listening");
      cardStatus.textContent = "🎤 Read the word!";
    }
  }
  rec.onstart = onReady;
  rec.onaudiostart = onReady;
  rec.onresult = function (e) {
    onReady();
    lastEvent = e;
    if (locked || deckDone()) return;
    if (Date.now() < ignoreUntil) { markFrom(e); return; }
    var word = current().w;
    for (var i = from.idx; i < e.results.length; i++) {
      for (var k = 0; k < e.results[i].length; k++) {
        var text = e.results[i][k].transcript;
        if (i === from.idx && from.prefix && text.indexOf(from.prefix) === 0) text = text.slice(from.prefix.length);
        if (heardWord(word, text)) { gotRight(); return; }
      }
    }
    // A finished phrase that wasn't the word: show red, keep listening.
    var last = e.results[e.results.length - 1];
    if (last.isFinal && e.results.length - 1 >= from.idx) {
      var said = last[0].transcript;
      if (e.results.length - 1 === from.idx && from.prefix && said.indexOf(from.prefix) === 0) said = said.slice(from.prefix.length);
      said = said.trim();
      if (said) gotWrong(said);
      markFrom(e);
    }
  };
  rec.onerror = function (e) {
    if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
      me.blocked = true;
      if (!micWorked) {
        wantListening = false;
        if (window.self !== window.top) {
          showBanner("The microphone can't be used inside this page. Open " +
            '<a href="' + GITHUB_URL + '" target="_blank" rel="noopener">the Power Words website</a> in Safari to use Flashcards.');
        } else {
          showBanner("Please allow the microphone. On an iPad or iPhone, also check that Dictation is on: " +
            "Settings → General → Keyboard → Enable Dictation.");
        }
      }
    }
  };
  rec.onend = function () {
    me.ended = true;
    if (me.stopped) return; // we stopped it on purpose
    if (sess === me) sess = null;
    cardEl.classList.remove("listening");
    // Phones stop listening every so often; start again by ourselves.
    if (wantListening && mode === "cards" && !deckDone() && !me.blocked) {
      setTimeout(function () { if (wantListening && !sess) startCards(); }, 250);
    } else if (wantListening && me.blocked && micWorked) {
      needTap();
    } else if (!deckDone()) {
      wantListening = false;
      if (!locked) cardStatus.textContent = "Tap 🎤 Start to begin!";
      setButtons("paused");
    }
  };
  try { rec.start(); } catch (err) { sess = null; needTap(); }
}
function needTap() {
  // The browser wants a tap before it will listen again.
  wantListening = false;
  cardEl.classList.remove("listening");
  cardStatus.textContent = "Tap 🎤 to keep going!";
  document.getElementById("cardMic").textContent = "🎤 Keep going";
  setButtons("needTap");
}
function stopCards() {
  wantListening = false;
  if (sess) { var s = sess; sess = null; s.ended = true; s.stopped = true; try { s.rec.abort(); } catch (e) {} }
  cardEl.classList.remove("listening");
}
function pauseCards() {
  stopCards();
  cardStatus.textContent = "Paused. Tap 🎤 Start to keep going.";
  document.getElementById("cardMic").textContent = "🎤 Start";
  setButtons("paused");
}

cardEl.onclick = function () { if (!sess && !deckDone()) startCards(); };
document.getElementById("cardMic").onclick = function () {
  document.getElementById("cardMic").textContent = "🎤 Start";
  startCards();
};
document.getElementById("cardPause").onclick = pauseCards;
document.getElementById("cardHear").onclick = function () {
  var c = current();
  if (!c) return;
  // Don't let the mic hear the iPad saying the word.
  ignoreUntil = Date.now() + 2500;
  speak(c.w);
};
document.getElementById("cardNext").onclick = function () {
  if (deck.result === null) { deck.result = false; deck.wrong++; deck.missed.push(current()); }
  deck.i++;
  markFrom(lastEvent);
  showCard();
  if (!deckDone() && !sess) startCards();
};
document.getElementById("cardRedo").onclick = function () { newDeck(deck.missed); showCard(); startCards(); };
document.getElementById("cardShuffle").onclick = function () { newDeck(ALL); showCard(); startCards(); };

setMode(mode);
</script>
</body>
</html>
